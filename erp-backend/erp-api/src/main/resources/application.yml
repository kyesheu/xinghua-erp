server:
  port: 6149

spring:
  # 本服务不装配任何模型客户端：模型调用全部由 ai-service（Python + LangGraph）承担，
  # 模型凭据在「AI 智能 > 模型配置」页面维护，调用时经请求头透传给 AI 服务。
  # 因此这里没有 spring.ai.* 配置，未配置密钥也能正常启动。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: erp-api
  profiles:
    # 本地/测试环境可放 application-dev.yml（已在 .gitignore 中排除，不会入库）
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    # redis 配置
    redis:
      # 地址
      host: 127.0.0.1
      # 端口，默认为6379
      port: 16379
      # 数据库索引
      database: 0
      # 密码（如启用 Redis 认证，通过环境变量 REDIS_PASSWORD 注入，勿在仓库中写明文）
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13370/xinghua-erp?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    # 数据库密码：本地开发默认值与 docker/docker-compose.yml 的 MYSQL_ROOT_PASSWORD 一致，
    # 生产环境必须通过环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:xinghua-erp-dev-only}
    hikari:
      maximum-pool-size: 10
      min-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 大模型凭据不落在配置文件：统一由「AI 智能 > 模型配置」页面维护（存 ai_config 表），
  # Java 侧由 AiOrchestrationService 读取，Python 服务由 PythonAgentClient 经请求头透传。
  # RabbitMQ：订单转入 OMS 后的异步通知链路；erp.mq.enabled=false 时不建连接、不启动监听，本地可无 MQ 运行。
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:56720}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 消费成功手动 ACK；异常 nack 且不重回队列，由死信交换机兜底。
        acknowledge-mode: manual
        prefetch: 10

# 消息队列开关：true 时生产者在订单转入后发布事件、消费者启动监听；false 时完全不启用 MQ。
erp:
  mq:
    enabled: ${ERP_MQ_ENABLED:false}
