# endpoint 供后端上传使用；public-url 必须是浏览器可访问的 MinIO 地址。
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:19000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:19000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:xinghua-erp}
  # 上传分类 -> 对象前缀。新增分类只改这里，前端传左侧的分类编码即可。
  # 对象最终路径：{前缀}/{yyyy-MM}/{uuid}.{ext}
  categories:
    goods: goods
    supplier-license: supplier/license
    avatar: user/avatar

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.xinghuaerp.oms.domain;cn.xinghuaerp.module.domain;cn.xinghuaerp.system.security.entity;
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启sql日志

# Token 配置
token:
  expireTime: 60       # Token 过期时间（分钟），默认30
  # JWT 签名密钥不入库，必须通过环境变量 TOKEN_SECRET 注入；默认值仅供本地开发，生产环境务必覆盖
  secret: ${TOKEN_SECRET:xinghua-erp-dev-token-secret-change-in-production}
