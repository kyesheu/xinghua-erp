  #     SPRING_DATASOURCE_USERNAME: root
  #     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_DATA_REDIS_PORT: "6379"
  #     SPRING_RABBITMQ_HOST: rabbitmq
  #     SPRING_RABBITMQ_PORT: "5672"
  #     ERP_MQ_ENABLED: "true"
  #     SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-unused}
  #     MINIO_ENDPOINT: http://minio:9000
  #     MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:19000}
  #     MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  #     MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  #     MINIO_BUCKET: ${MINIO_BUCKET:-xinghua-erp}
  #   ports:
  #     - "127.0.0.1:6149:6149"
  #   volumes:
  #     - type: bind
  #       source: ../erp-backend/erp-api/target/erp-api-4.1.0.jar
  #       target: /app/erp-api.jar
  #       read_only: true
  #       bind:
  #         create_host_path: false
  #   command: ["java", "-Duser.timezone=Asia/Shanghai", "-jar", "/app/erp-api.jar"]
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio-init:
  #       condition: service_completed_successfully

  # 前端开发服务：需要容器运行时，取消 frontend 整段注释。
  # 执行 docker compose up -d frontend，浏览器访问 http://localhost:88
  # 浏览器直连本机 6149，后端可由 IDEA 或上面的 backend 容器提供。
  # frontend:
  #   image: node:24-alpine
  #   working_dir: /appe
  #   environment:
  #     TZ: Asia/Shanghai
  #     VITE_APP_BASE_API: http://localhost:6149
  #     VITE_APP_SSE_URL: http://localhost:6149
  #   ports:
  #     - "127.0.0.1:88:88"
  #   volumes:
  #     - ../erp-frontend:/app
  #     - frontend-node-modules:/app/node_modules
  #   command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 88 --strictPort"]

  # 生产静态部署（可选）：先在 erp-frontend/ 执行 npm run build 产出 dist/，
  # 再取消 nginx 整段注释并执行 docker compose up -d nginx，浏览器访问 http://localhost:80。
  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   environment:
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "127.0.0.1:80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ../erp-frontend/dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - mysql

  # 消息队列：订单转入 OMS 后的异步通知链路；应用侧 erp.mq.enabled=false 时不连接，容器可按需启动。
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:56720:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  # 与 frontend 服务一起取消注释。
  # frontend-node-modules:
