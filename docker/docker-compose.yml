name: xinghua-erp

# 本地开发：在本目录执行 docker compose up -d
# 查看状态：docker compose ps
# 停止环境（保留数据）：docker compose down
# MySQL 首次启动会导入项目 SQL，仅在数据卷为空时执行，请等待健康检查通过。
# 与 erp-backend/erp-api/src/main/resources/application.yml 一致，前后端可直接在 IDEA 启动。
# 配置映射：./mysql/conf.d → 容器 /etc/mysql/conf.d（放 my.cnf 即生效，重启容器读取）；
#           ./nginx/nginx.conf → nginx 容器 /etc/nginx/nginx.conf（见下方注释服务）。
services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 密码不入库：本地开发通过环境变量注入，例如 export MYSQL_ROOT_PASSWORD=xinghua-erp-dev-only
      # 数据库 root 密码不入库：本地开发通过环境变量注入，例如
      #   export MYSQL_ROOT_PASSWORD=xinghua-erp-dev-only
      # 并保证与后端启动时的 DB_PASSWORD 取值一致。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinghua-erp-dev-only}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: xinghua-erp
    ports:
      - "127.0.0.1:13370:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 自定义 MySQL 配置：把 my.cnf 放进 ./mysql/conf.d/ 即生效（重启容器读取）。
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      # 主 SQL 已含基础数据，不重复导入 docs/init-data，避免主键冲突。
      - type: bind
        source: ../docs/sql/xinghua-erp.sql
        target: /docker-entrypoint-initdb.d/01-xinghua-erp.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP 连接确保初始化临时实例退出、SQL 导入结束后才报告健康。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -D xinghua-erp -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 注意：MinIO 官方镜像（minio/minio、quay.io/minio）已于 2025-10 从各仓库下架，
  # 改用社区重建镜像 coollabsio/minio（最终社区版 RELEASE.2025-10-15 的重建，内含 mc）。
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      # 该镜像不带 curl，用内置 mc 的 ready 子命令做健康检查。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 自动创建存储桶；本地开发按分类允许图片直读，保留旧 images/ 链接，禁止匿名写入、列举。
  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: on-failure
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-xinghua-erp}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/images/*","arn:aws:s3:::%s/supplier-license/*","arn:aws:s3:::%s/avatar/*","arn:aws:s3:::%s/goods/*"]}]}' "$$MINIO_BUCKET" "$$MINIO_BUCKET" "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/image-policy.json
        mc anonymous set-json /tmp/image-policy.json "local/$$MINIO_BUCKET"

  # 后端：需要容器运行时，取消 backend 整段注释。
  # 先在项目根目录执行 mvn -pl erp-api -am clean package -DskipTests
  # 再执行 docker compose up -d backend
